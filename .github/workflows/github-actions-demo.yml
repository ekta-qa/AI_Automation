name: Playwright UI & API 

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  automation-suite:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Install Playwright Operating System Dependencies & Browsers
      run: npx playwright install --with-deps

    # Step 1: Execute the 3 API scenarios (Fast feedback loop)
    - name: Run API Tests (Fake Store API)
      run: npx playwright test tests/fakestoreapi.spec.ts/

    # Step 2: Execute the 6 UI scenarios (Sauce Demo web tests)
    - name: Run UI Tests (Sauce Demo)
      run: npx playwright test tests/saucedemo.spec.ts/

    # Step 3: Archive the combined HTML visual execution report
    - name: Upload Test Report Artifact
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-execution-report
        path: playwright-report/
        retention-days: 7
